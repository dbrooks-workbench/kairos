<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="header-left">
        <span id="app-name">Kairos</span>
        <div id="nav">
          <button id="btn-prev">&#8249;</button>
          <button id="btn-today">Today</button>
          <button id="btn-next">&#8250;</button>
        </div>
        <span id="week-label"></span>
      </div>
      <div id="header-right">
        <button id="btn-add" class="btn-add" title="New event or task">+</button>
        <div class="view-toggle">
          <button id="btn-view-calendar" class="view-toggle-btn active">Calendar</button>
          <button id="btn-view-board"    class="view-toggle-btn">Board</button>
        </div>
        <div id="cal-picker-wrap">
          <button id="btn-calendars">Calendars</button>
          <div id="cal-picker-panel" hidden></div>
        </div>
        <div id="account-wrap">
          <div id="account-status"></div>
          <div id="account-panel" hidden></div>
        </div>
      </div>
    </header>

    <div id="loading-bar"></div>

    <div id="connect-banner">
      Sign in to connect your Google Calendar and Tasks.
      <a id="btn-signin" href="/auth/start">Sign in with Google</a>
    </div>

    <div id="calendar">
      <div id="timed-scroll">
        <div id="pinned-top">
          <div id="col-headers">
            <div id="col-headers-gutter"></div>
            <div id="col-headers-days"></div>
          </div>
          <div id="allday-row">
            <div id="allday-label">
            <button id="btn-allday-toggle" title="Toggle all-day events">▾ all‑day</button>
          </div>
            <div id="allday-cols"></div>
          </div>
        </div>
        <div id="timed-area">
          <div id="time-gutter"></div>
          <div id="timed-cols"></div>
        </div>
      </div>
    </div>

    <!-- Board view -->
    <div id="board" hidden></div>

    <!-- Task editor modal -->
    <div id="task-modal" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <input id="modal-title" class="modal-title-input" type="text" placeholder="Task title…">
        <button id="modal-close" class="modal-close-btn" title="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-field-row">
          <label class="modal-label">List</label>
          <select id="modal-list" class="modal-select"></select>
        </div>
        <div class="modal-field-row">
          <label class="modal-label">Due</label>
          <input id="modal-due" class="modal-input" type="date">
        </div>
        <div class="modal-field-row">
          <label class="modal-label">LOE</label>
          <input id="modal-loe" class="modal-input" type="text" placeholder="1d 4h 30m">
          <span id="modal-loe-error" class="modal-loe-error" hidden>Invalid format (use 1d 4h 30m)</span>
        </div>
        <div class="modal-field">
          <textarea id="modal-notes" class="modal-notes" placeholder="Notes…" rows="4"></textarea>
        </div>
        <details class="modal-section" id="modal-checklist-section">
          <summary>
            <span class="modal-chevron">›</span>
            Checklist
            <span id="modal-checklist-count" class="modal-section-count"></span>
          </summary>
          <div id="modal-checklist-items"></div>
          <div class="modal-add-row">
            <input id="modal-checklist-input" type="text" placeholder="Add item…">
            <button id="modal-checklist-add">Add</button>
          </div>
        </details>
        <details class="modal-section" id="modal-comments-section">
          <summary>
            <span class="modal-chevron">›</span>
            Comments
            <span id="modal-comments-count" class="modal-section-count"></span>
          </summary>
          <div id="modal-comments-items"></div>
          <div class="modal-add-row">
            <input id="modal-comment-input" type="text" placeholder="Add comment…">
            <button id="modal-comment-add">Add</button>
          </div>
        </details>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-left">
          <button id="modal-delete"          class="btn-danger"    hidden>Delete</button>
          <button id="modal-toggle-complete" class="btn-secondary" hidden>Mark complete</button>
        </div>
        <div class="modal-footer-right">
          <button id="modal-cancel" class="btn-ghost">Cancel</button>
          <button id="modal-save"   class="btn-primary">Save</button>
        </div>
      </div>
    </div><!-- /.modal-panel -->
    </div><!-- /#task-modal -->

    <!-- Context menu for new event / new task -->
    <div id="context-menu" hidden>
      <button class="ctx-item" id="ctx-new-event">📅 New event</button>
      <button class="ctx-item" id="ctx-new-task">✓ New task</button>
    </div>

    <!-- Event editor modal -->
    <div id="event-modal" hidden>
      <div class="modal-panel" id="event-modal-panel">
        <div class="modal-header">
          <input id="event-modal-title" class="modal-title-input" type="text" placeholder="Event title…">
          <button id="event-modal-close" class="modal-close-btn" title="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-field-row">
            <label class="modal-label">Calendar</label>
            <select id="event-modal-calendar" class="modal-select"></select>
          </div>
          <div class="modal-field-row">
            <label class="modal-label">All day</label>
            <input id="event-modal-allday" type="checkbox">
          </div>
          <div class="modal-field-row">
            <label class="modal-label">Start</label>
            <input id="event-modal-start-date" class="modal-input event-date-input" type="date">
            <input id="event-modal-start-time" class="modal-input event-time-input" type="time">
          </div>
          <div class="modal-field-row">
            <label class="modal-label">End</label>
            <input id="event-modal-end-date" class="modal-input event-date-input" type="date">
            <input id="event-modal-end-time" class="modal-input event-time-input" type="time">
          </div>
          <div class="modal-field-row">
            <label class="modal-label">Repeats</label>
            <select id="event-modal-recur" class="modal-select">
              <option value="">Does not repeat</option>
              <option value="DAILY">Daily</option>
              <option value="WEEKLY">Weekly</option>
              <option value="WEEKDAYS">Every weekday (Mon–Fri)</option>
              <option value="MONTHLY">Monthly</option>
              <option value="ANNUALLY">Annually</option>
              <option value="CUSTOM">Custom…</option>
            </select>
          </div>

          <!-- Custom recurrence panel — shown when "Custom…" is selected -->
          <div id="custom-recur-panel" class="custom-recur-panel" hidden>
            <div class="crp-row">
              <span class="crp-label">Every</span>
              <input id="crp-interval" type="number" min="1" max="999" value="1" class="crp-interval">
              <select id="crp-freq" class="crp-select">
                <option value="DAILY">day(s)</option>
                <option value="WEEKLY" selected>week(s)</option>
                <option value="MONTHLY">month(s)</option>
                <option value="YEARLY">year(s)</option>
              </select>
            </div>
            <div id="crp-days-row" class="crp-row">
              <span class="crp-label">On</span>
              <div class="crp-day-group">
                <button type="button" class="crp-day" data-day="SU">S</button>
                <button type="button" class="crp-day" data-day="MO">M</button>
                <button type="button" class="crp-day" data-day="TU">T</button>
                <button type="button" class="crp-day" data-day="WE">W</button>
                <button type="button" class="crp-day" data-day="TH">T</button>
                <button type="button" class="crp-day" data-day="FR">F</button>
                <button type="button" class="crp-day" data-day="SA">S</button>
              </div>
            </div>
            <div class="crp-row crp-end-section">
              <span class="crp-label">Ends</span>
              <div class="crp-end-options">
                <label class="crp-end-row"><input type="radio" name="crp-end" value="never" checked> Never</label>
                <label class="crp-end-row">
                  <input type="radio" name="crp-end" value="date"> On
                  <input id="crp-end-date" type="date" class="crp-end-input" disabled>
                </label>
                <label class="crp-end-row">
                  <input type="radio" name="crp-end" value="count"> After
                  <input id="crp-end-count" type="number" min="1" max="999" value="10" class="crp-end-input crp-count-input" disabled>
                  <span>occurrences</span>
                </label>
              </div>
            </div>
          </div>

          <div class="modal-field-row">
            <label class="modal-label">Location</label>
            <input id="event-modal-location" class="modal-input" type="text" placeholder="Add location…">
          </div>
          <div class="modal-field">
            <textarea id="event-modal-desc" class="modal-notes" placeholder="Description…" rows="4"></textarea>
          </div>
          <!-- Only shown when editing a recurring event -->
          <div class="modal-field-row" id="event-recur-scope-row" hidden>
            <label class="modal-label">Apply to</label>
            <select id="event-recur-scope" class="modal-select">
              <option value="this">This event</option>
              <option value="following">This and following events</option>
              <option value="all">All events</option>
            </select>
          </div>
          <details class="modal-section" id="event-spawn-section">
            <summary>
              <span class="modal-chevron">›</span>
              Spawn tasks
              <span id="event-spawn-count" class="modal-section-count"></span>
            </summary>
            <div id="event-spawn-items"></div>
            <div class="modal-add-row">
              <button id="event-spawn-add" type="button">+ Add spawn task</button>
            </div>
          </details>
        </div>
        <div class="modal-footer">
          <div></div>
          <div class="modal-footer-right">
            <button id="event-modal-cancel" class="btn-ghost">Cancel</button>
            <button id="event-modal-save" class="btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Snooze popover (shared, positioned via JS) -->
    <div id="snooze-popover" hidden>
      <div class="snooze-quick">
        <button class="snooze-quick-btn" id="snooze-q-tomorrow"></button>
        <button class="snooze-quick-btn" id="snooze-q-weekend"></button>
        <button class="snooze-quick-btn" id="snooze-q-nextweek"></button>
      </div>
      <div class="snooze-divider"></div>
      <div class="snooze-custom-row">
        <span class="snooze-label">Snooze for</span>
        <input id="snooze-days" class="snooze-input" type="number" min="1" max="365" value="3">
        <span id="snooze-day-label" class="snooze-unit">days</span>
        <button id="snooze-confirm" class="snooze-ok">OK</button>
      </div>
    </div>
  </div><!-- /#app -->

  <script type="module" src="app.js"></script>
</body>
</html>
