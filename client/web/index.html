<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="header-left">
        <span id="app-name">Kairos</span>
        <div id="nav">
          <button id="btn-prev">&#8249;</button>
          <button id="btn-today">Today</button>
          <button id="btn-next">&#8250;</button>
        </div>
        <span id="week-label"></span>
      </div>
      <div id="header-right">
        <div id="cal-picker-wrap">
          <button id="btn-calendars">Calendars</button>
          <div id="cal-picker-panel" hidden></div>
        </div>
        <div id="account-status"></div>
      </div>
    </header>

    <div id="connect-banner">
      Sign in to connect your Google Calendar and Tasks.
      <a id="btn-signin" href="/auth/start">Sign in with Google</a>
    </div>

    <div id="calendar">
      <div id="timed-scroll">
        <div id="col-headers">
          <div id="col-headers-gutter"></div>
          <div id="col-headers-days"></div>
        </div>
        <div id="allday-row">
          <div id="allday-label">all-day</div>
          <div id="allday-cols"></div>
        </div>
        <div id="timed-area">
          <div id="time-gutter"></div>
          <div id="timed-cols"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
