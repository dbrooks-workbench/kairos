  <rect x="3"    y="6" width="7" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="12.5" y="6" width="7" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="22"   y="6" width="7" height="20" rx="2" fill="rgba(255,255,255,0.2)"/>
  <!-- Cards: column 1 (white) -->
