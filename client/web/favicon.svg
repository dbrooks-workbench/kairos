  <rect x="4"    y="13"   width="5" height="2.5" rx="1" fill="white"/>
  <!-- Cards: column 2 (amber — in progress) -->
  <rect x="13.5" y="8.5"  width="5" height="2.5" rx="1" fill="#fbbf24"/>
  <rect x="13.5" y="13"   width="5" height="2.5" rx="1" fill="#fbbf24"/>
  <!-- Cards: column 3 (white) -->
  <rect x="23"   y="8.5"  width="5" height="2.5" rx="1" fill="white"/>
  <rect x="23"   y="13"   width="5" height="2.5" rx="1" fill="white"/>
  <rect x="23"   y="17.5" width="5" height="2.5" rx="1" fill="white"/>
