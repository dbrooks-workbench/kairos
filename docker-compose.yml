services:
  api:
    image: ghcr.io/dbrooks-workbench/kairos-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    volumes:
      - kairos_data:/app/data
    networks:
      - internal

  web:
    image: ghcr.io/dbrooks-workbench/kairos-web:latest
    build: ./client/web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - internal

volumes:
  kairos_data:

networks:
  internal:
    driver: bridge
